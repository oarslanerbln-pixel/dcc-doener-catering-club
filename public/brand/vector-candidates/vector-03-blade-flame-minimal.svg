<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- DCC Candidate 03: The Razor & Flame Minimalist Arc -->
  <defs>
    <linearGradient id="bladeGrad03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#FF9326"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#060606"/>

  <g transform="translate(250, 205)">
    <!-- Precision Minimalist Knife Profile transforming into Ember Arc -->
    <!-- Left Blade Spine: Razor straight vertical with micro-bevel -->
    <path d="M -18 120 
             L -18 -80 
             C -18 -110, -5 -135, 12 -155 
             C 10 -130, 25 -110, 32 -85 
             C 42 -50, 36 -15, 20 25 
             C 4 60, -2 95, -2 120 
