  <text x="250" y="442" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="600" font-size="8.5" letter-spacing="0.5em" fill="#D4A853">
    THE ARCHITECTURAL DÖNER CLUB
