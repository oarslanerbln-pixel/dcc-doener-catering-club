    <!-- Secondary Minimalist Accent Needle -->
    <path d="M 38 -20 C 44 -40, 42 -65, 34 -85 C 48 -60, 50 -35, 42 -10 C 38 4, 32 18, 26 30 L 22 25 C 28 12, 34 0, 38 -20 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- Geometric Diamond Purity Rivets -->
    <polygon points="-14,140 -11,136 -8,140 -11,144" fill="#D4A853"/>
    <polygon points="-14,160 -11,156 -8,160 -11,164" fill="#D4A853"/>
  </g>

  <!-- Typography -->
  <text x="250" y="415" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="24" letter-spacing="0.36em" fill="#FFFFFF">
    D C C
