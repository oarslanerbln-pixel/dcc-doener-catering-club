<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- DCC Candidate 07: The 45° Ember Monolith Cut -->
  <defs>
    <linearGradient id="monolithGold07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#060606"/>

  <g transform="translate(250, 205)">
    <!-- Heavyweight Silhouette of Vertical Rotisserie Stack -->
    <!-- Upper Monolith Section (Top half before 45-degree knife slice) -->
    <path d="M -80 -130 
             L 80 -130 
             L 80 -40 
             L -80 40 
             Z" 
          fill="url(#monolithGold07)"/>

    <!-- Lower Monolith Section (Separated by 16px razor slice cut) -->
    <path d="M -80 62 
             L 80 -18 
             L 80 130 
             L -80 130 
             Z" 
          fill="#FFFFFF"/>

    <!-- Razor Diagonal Cut Glow Accent -->
    <line x1="-95" y1="51" x2="95" y2="-29" stroke="#FFA733" stroke-width="3"/>

    <!-- Negative Space D-C-C Cutouts on the Face of the Monolith -->
    <g transform="translate(0, 0)">
      <circle cx="-50" cy="-60" r="10" fill="#060606"/>
      <circle cx="0" cy="-35" r="10" fill="#060606"/>
      <circle cx="50" cy="-10" r="10" fill="#060606"/>
    </g>

    <!-- Top and Bottom Spindle Anchor Points -->
    <line x1="0" y1="-155" x2="0" y2="-130" stroke="url(#monolithGold07)" stroke-width="4"/>
    <line x1="0" y1="130" x2="0" y2="155" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Typography -->
  <text x="250" y="420" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="26" letter-spacing="0.38em" fill="#FFFFFF">
    D C C
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="700" font-size="9" letter-spacing="0.45em" fill="#D4A853">
    BERLIN · HAUTE DÖNER SERVICE
  </text>
</svg>