<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- DCC Candidate 06: The Minimalist Royal Spindle -->
  <defs>
    <linearGradient id="spindleGrad06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0D5"/>
      <stop offset="50%" stop-color="#D4A853"/>
      <stop offset="100%" stop-color="#8F6218"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#060606"/>

  <g transform="translate(250, 205)">
    <!-- Architectural Micro Coronet Finial (3-point geometric apex, never gaming-like) -->
    <path d="M -30 -120 
             L -15 -145 
             L 0 -130 
             L 15 -145 
             L 30 -120 
             L 18 -120 
             L 0 -110 
             L -18 -120 
             Z" 
          fill="url(#spindleGrad06)"/>

    <!-- Central Vertical Rotisserie Axis Line -->
    <line x1="0" y1="-110" x2="0" y2="110" stroke="url(#spindleGrad06)" stroke-width="3"/>

    <!-- Symmetrical Horizontal Yaprak Horizon Wings -->
    <line x1="-80" y1="-70" x2="80" y2="-70" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="square"/>
    <line x1="-95" y1="-35" x2="95" y2="-35" stroke="url(#spindleGrad06)" stroke-width="2" stroke-linecap="square"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="-90" y1="35" x2="90" y2="35" stroke="url(#spindleGrad06)" stroke-width="2" stroke-linecap="square"/>
    <line x1="-70" y1="70" x2="70" y2="70" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="square"/>

    <!-- Minimalist Heavy Pedestal Base -->
    <polygon points="-40,110 40,110 55,126 -55,126" fill="url(#spindleGrad06)"/>
    <rect x="-65" y="128" width="130" height="4" fill="#FFFFFF"/>

    <!-- Subtle Flanking Monogram Initials -->
    <text x="-125" y="10" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#spindleGrad06)" opacity="0.9">
      D
    </text>
    <text x="125" y="10" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="28" fill="url(#spindleGrad06)" opacity="0.9">
      CC
    </text>
  </g>

  <!-- Typography -->
  <text x="250" y="420" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="900" font-size="21" letter-spacing="0.32em" fill="#FFFFFF">
    DÖNER CATERING CLUB
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.48em" fill="#D4A853">
    LIVE GASTRONOMY ATELIER
  </text>
</svg>